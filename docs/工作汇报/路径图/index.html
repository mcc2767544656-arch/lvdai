],[43.0,20.3,-31.26,66.5],[43.2,20.33,-31.28,66.3],[43.4,20.36,-31.3,66.1],[43.6,20.39,-31.31,66.0],[43.8,20.42,-31.33,65.9],[44.0,20.45,-31.34,65.9],[44.2,20.48,-31.35,65.9],[44.4,20.51,-31.37,65.4],[44.6,20.53,-31.38,65.4],[44.8,20.56,-31.39,65.6],[45.0,20.59,-31.4,65.6],[45.2,20.61,-31.41,65.1],[45.4,20.64,-31.43,64.9],[45.6,20.66,-31.44,64.7],[45.8,20.68,-31.46,64.4],[46.0,20.7,-31.47,64.3],[46.2,20.72,-31.48,64.1],[46.4,20.73,-31.5,63.6],[46.6,20.76,-31.51,63.4],[46.8,20.78,-31.52,63.4],[47.0,20.8,-31.53,63.4],[47.2,20.81,-31.54,62.9],[47.4,20.83,-31.55,61.9],[47.6,20.85,-31.57,62.4],[47.8,20.87,-31.58,61.2],[48.0,20.88,-31.59,60.7],[48.2,20.89,-31.6,60.8],[48.4,20.91,-31.61,61.1],[48.6,20.93,-31.62,60.8],[48.8,20.95,-31.63,60.9],[49.0,20.97,-31.64,61.0],[49.2,20.98,-31.65,60.9],[49.4,21.0,-31.66,61.0],[49.6,21.02,-31.67,61.1],[49.8,21.03,-31.68,60.8],[50.0,21.04,-31.69,61.0],[50.2,21.06,-31.7,60.5],[50.4,21.08,-31.71,60.7],[50.6,21.09,-31.72,60.3],[50.8,21.1,-31.73,60.1],[51.0,21.11,-31.74,60.4],[51.2,21.11,-31.74,60.3],[51.4,21.11,-31.74,60.1],[51.6,21.11,-31.74,60.0],[51.8,21.11,-31.74,60.1],[52.0,21.11,-31.74,59.9],[52.2,21.11,-31.74,59.7],[52.4,21.12,-31.74,59.9],[52.6,21.11,-31.74,59.4],[52.7,21.11,-31.74,59.0]],"plan":[[12.45,-27.48],[21.38,-31.99]],"length":9.82,"dur":52.7,"mean_speed":0.186,"maxdev":0.1}]};
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('plot');
const tip = document.getElementById('tip');
const runsBox = document.getElementById('runs');

let current = 'all';
let view = { cx:0, cy:0, w:1, h:1 };
let sel = null;          // 当前渲染的点集 [{x,y,t,hd,color,run}]

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function fmt(n, d=2){ return Number(n).toFixed(d); }

/* ---- 侧栏 ---- */
function buildSidebar() {
  const all = document.createElement('div');
  all.className = 'run' + (current==='all' ? ' active':'');
  all.innerHTML = '<div class="name"><span class="dot" style="background:#9fb3cc"></span>总览（全部 4 段）</div>' +
                  '<div class="meta">同一场地内的累计路线</div>';
  all.onclick = () => select('all');
  runsBox.appendChild(all);

  DATA.runs.forEach(r => {
    const d = document.createElement('div');
    d.className = 'run' + (current===r.id ? ' active':'');
    d.innerHTML = `<div class="name"><span class="dot" style="background:${r.color}"></span>${r.short}</div>
                   <div class="meta">${r.length} m · ${r.dur} s · ${r.start.slice(6)}</div>`;
    d.onclick = () => select(r.id);
    runsBox.appendChild(d);
  });
}

function select(id) {
  current = id;
  [...runsBox.children].forEach((c,i) => c.classList.toggle('active', (i===0 && id==='all') || (i>0 && DATA.runs[i-1].id===id)));
  render();
}

/* ---- 渲染 ---- */
function collect() {
  const runs = current === 'all' ? DATA.runs : DATA.runs.filter(r => r.id === current);
  const pts = [];
  runs.forEach(r => r.pts.forEach(p => pts.push({x:p[1], y:p[2], t:p[0], hd:p[3], color:r.color, run:r})));
  return { runs, pts };
}

function render() {
  const { runs, pts } = collect();
  sel = pts;
  svg.innerHTML = '';
  if (!pts.length) return;

  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = Math.max(3, Math.max(maxX-minX, maxY-minY) * 0.12);
  view.w = (maxX-minX) + pad*2;
  view.h = (maxY-minY) + pad*2;
  view.cx = (minX+maxX)/2;
  view.cy = (minY+maxY)/2;
  draw();
  updateFooter(runs);
}

function draw() {
  svg.innerHTML = '';
  const W = svg.clientWidth || 800, H = svg.clientHeight || 600;
  const aspect = W / H;
  let vw = view.w, vh = view.h;
  if (vw / vh > aspect) vh = vw / aspect; else vw = vh * aspect;
  const x0 = view.cx - vw/2, y0 = view.cy + vh/2;   // y 轴向上
  svg.setAttribute('viewBox', `${x0} ${view.cy - vh/2} ${vw} ${vh}`);

  const g = el('g', {}, svg);

  // 网格
  const step = niceStep(vw / 9);
  const gx0 = Math.floor(x0/step)*step, gx1 = x0+vw;
  const gy0 = Math.floor((view.cy-vh/2)/step)*step, gy1 = view.cy+vh/2;
  for (let x = gx0; x <= gx1; x += step) {
    el('line', {x1:x, y1:gy0, x2:x, y2:gy1, stroke:'#1d2739', 'stroke-width':0.5}, g);
    el('text', {x:x, y:gy0 + (gy1-gy0)*0.03, fill:'#5c6d86', 'font-size':Math.max(1.6, vw*0.018),
                'text-anchor':'middle'}, g).textContent = Math.round(x) + ' m';
  }
  for (let y = gy0; y <= gy1; y += step) {
    el('line', {x1:gx0, y1:y, x2:gx1, y2:y, stroke:'#1d2739', 'stroke-width':0.5}, g);
  }

  // 轨迹
  const groups = {};
  sel.forEach(p => { (groups[p.run.id] = groups[p.run.id] || []).push(p); });
  Object.entries(groups).forEach(([id, arr]) => {
    const color = arr[0].color;
    const d = arr.map((p,i) => (i? 'L':'M') + p.x + ' ' + p.y).join(' ');
    el('path', {d, fill:'none', stroke:color, 'stroke-width':Math.max(0.35, vw*0.004),
                'stroke-linejoin':'round', 'stroke-linecap':'round', opacity:0.95}, g);
    // 方向箭头：固定屏幕尺寸的小箭头，按屏幕间距均匀放置，避免聚成一团
    const pxPerM = vw / (svg.clientWidth || 800);
    const gapM  = 70 * pxPerM;          // 相邻箭头约 70 px
    const sizeM = 4.5 * pxPerM;         // 箭头长约 9 px
    const strokeM = Math.max(pxPerM, 1.1 * pxPerM);
    let acc = gapM * 0.5, next = gapM;
    for (let i = 1; i < arr.length; i++) {
      const p = arr[i], q = arr[i-1];
      acc += Math.hypot(p.x - q.x, p.y - q.y);
      if (acc < next) continue;
      next += gapM;
      const ang = Math.atan2(p.y - q.y, p.x - q.x) * 180/Math.PI;
      el('path', {d:`M ${-sizeM} ${-sizeM*0.62} L 0 0 L ${-sizeM} ${sizeM*0.62}`,
                  fill:'none', stroke:color, 'stroke-width':strokeM,
                  'stroke-linecap':'round', 'stroke-linejoin':'round',
                  transform:`translate(${p.x},${p.y}) rotate(${ang})`, opacity:0.9}, g);
    }
    // 起点 / 终点
    const a = arr[0], b = arr[arr.length-1];
    el('circle', {cx:a.x, cy:a.y, r:Math.max(0.7, vw*0.009), fill:'#0f1420', stroke:'#38d39f', 'stroke-width':Math.max(0.3, vw*0.004)}, g);
    el('circle', {cx:b.x, cy:b.y, r:Math.max(0.7, vw*0.009), fill:'#0f1420', stroke:'#ff6b6b', 'stroke-width':Math.max(0.3, vw*0.004)}, g);
    // 标签
    if (current === 'all') {
      const t = el('text', {x:a.x, y:a.y - Math.max(1.5, vw*0.025), fill:color,
                            'font-size':Math.max(2.0, vw*0.028), 'font-weight':'600'}, g);
      t.textContent = arr[0].run.short;
    }
  });

  // 预设路径（虚线）
  (current === 'all' ? DATA.runs : DATA.runs.filter(r => r.id === current)).forEach(r => {
    if (!r.plan || r.plan.length < 2) return;
    const d = r.plan.map((p,i) => (i? 'L':'M') + p[0] + ' ' + p[1]).join(' ');
    el('path', {d, fill:'none', stroke:'#7c8ba3', 'stroke-width':Math.max(0.25, vw*0.0028),
                'stroke-dasharray':`${Math.max(1.2, vw*0.012)} ${Math.max(0.9, vw*0.009)}`, opacity:0.8}, g);
    r.plan.forEach(p => el('rect', {x:p[0]-Math.max(0.35, vw*0.004), y:p[1]-Math.max(0.35, vw*0.004),
                                    width:Math.max(0.7, vw*0.008), height:Math.max(0.7, vw*0.008),
                                    fill:'none', stroke:'#93a3ba', 'stroke-width':Math.max(0.2, vw*0.002)}, g));
  });

  // 比例尺
  const barM = niceStep(vw/6);
  const bx = x0 + vw*0.04, by = view.cy - vh/2 + vh*0.94;
  el('line', {x1:bx, y1:by, x2:bx+barM, y2:by, stroke:'#8fa0b8', 'stroke-width':Math.max(0.25, vw*0.003)}, g);
  const bt = el('text', {x:bx+barM/2, y:by - vh*0.012, fill:'#8fa0b8', 'font-size':Math.max(1.6, vw*0.02), 'text-anchor':'middle'}, g);
  bt.textContent = barM + ' m';

  // 北向指示
  const nx = x0 + vw*0.94, ny = view.cy + vh*0.06;
  el('path', {d:`M ${nx} ${ny - vh*0.05} l ${-vw*0.012} ${vh*0.07} l ${vw*0.012} ${-vh*0.02} l ${vw*0.012} ${vh*0.02} Z`,
              fill:'#6d7f99'}, g);
  const nt = el('text', {x:nx, y:ny + vh*0.03, fill:'#6d7f99', 'font-size':Math.max(1.6, vw*0.02),
                          'text-anchor':'middle'}, g);
  nt.textContent = 'N';
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return m * p;
}

function updateFooter(runs) {
  const len = runs.reduce((s,r)=>s+r.length, 0);
  const dur = runs.reduce((s,r)=>s+r.dur, 0);
  document.getElementById('m-len').textContent = fmt(len) + ' m';
  document.getElementById('m-dur').textContent = fmt(dur, 1) + ' s';
  document.getElementById('m-spd').textContent = fmt(len/dur, 3) + ' m/s';
  document.getElementById('m-dev').textContent = runs.length === 1 ? fmt(runs[0].maxdev) + ' m' : '—';
  document.getElementById('m-note').textContent = runs.length === 1 ? runs[0].note : '四段测试按时间顺序：直线 → 重复直线 → 45° 弯 → 10 m 直线。';
}

/* ---- 交互 ---- */
let drag = null;
svg.addEventListener('mousedown', e => { drag = {x:e.clientX, y:e.clientY, cx:view.cx, cy:view.cy}; svg.classList.add('dragging'); });
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (drag) {
    const vb = svg.viewBox.baseVal, rect = svg.getBoundingClientRect();
    const scale = vb.width / (rect.width || 1);
    view.cx = drag.cx - (e.clientX - drag.x) * scale;
    view.cy = drag.cy - (e.clientY - drag.y) * scale;
    draw();
  }
});
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const vb = svg.viewBox.baseVal, rect = svg.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const mx = vb.x + (e.clientX - rect.left) / rect.width * vb.width;
  const my = vb.y + (e.clientY - rect.top) / rect.height * vb.height;
  const f = e.deltaY > 0 ? 1.15 : 1/1.15;
  const r = 1 - 1/f;
  view.cx += (mx - view.cx) * r;
  view.cy += (my - view.cy) * r;
  view.w *= f; view.h *= f;
  draw();
}, {passive:false});

svg.addEventListener('mousemove', e => {
  if (!sel || !sel.length) return;
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const mx = vb.x + (e.clientX - rect.left) / rect.width * vb.width;
  const my = vb.y + (e.clientY - rect.top) / rect.height * vb.height;
  let best = null, bd = Infinity;
  for (const p of sel) {
    const d = (p.x-mx)**2 + (p.y-my)**2;
    if (d < bd) { bd = d; best = p; }
  }
  const tol = (vb.width/rect.width) * 18;
  if (best && Math.sqrt(bd) < tol) {
    tip.style.display = 'block';
    tip.style.left = (e.clientX - rect.left + 14) + 'px';
    tip.style.top = (e.clientY - rect.top + 12) + 'px';
    tip.innerHTML = `<b>${best.run.short}</b><br>
      t+${fmt(best.t,1)} s · 航向 ${fmt(best.hd,1)}°<br>
      ENU (${fmt(best.x)}, ${fmt(-best.y)}) m`;
  } else {
    tip.style.display = 'none';
  }
});
svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

/* ---- 启动 ---- */
buildSidebar();
render();
window.addEventListener('resize', () => draw());
</script>
